<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DANOverkill's Weather-App</title>
  </head>
  <body>
    <header>
      <h1 class="siteName">DANOverkill's Weather App</h1>
      <form id="searchForm">
        <fieldset class="switchName">
          <legend>Choose your prefered unit</legend>
          <label class="switch" for="unit">
            <legend class="sliderLable">°C</legend>
            <legend class="sliderLable">°F</legend>
            <input type="checkbox" id="unit" />
            <span class="slider round"></span>
          </label>
        </fieldset>

        <fieldset class="switchName">
          <legend>Turn on Geo Location</legend>
          <label class="switch" for="geoLoc">
            <legend class="sliderLable">Off</legend>
            <legend class="sliderLable">ON</legend>
            <input type="checkbox" id="geoLoc" />
            <span class="slider round"></span>
          </label>
        </fieldset>

        <fieldset class="searchBar" id="searchBarElement">
          <legend>Seach your City</legend>
          <input type="text" id="searchBar" placeholder="Search..." />
          <button type="submit" id="submitSearch" class="button">Submit</button>
        </fieldset>
      </form>
    </header>
    <div id="mainContainer">
      <!-- main section where current temp is displaied -->
      <div class="display-box" id="currentTemp">
        <div id="location">--</div>
        <div id="Temp">--</div>
        <div id="tempUnit">--</div>
        <div id="weatherIcon-container">
          <img src="#" id="weatherIcon" class="icons" />
        </div>
        <div id="windSpeed">--</div>
        <div id="humidity">--</div>
        <div id="uvIndex">--</div>
      </div>
      <!-- extra boxes for future hourly forcast -->
      <div class="display-box" id="nextHoursTemperaturs">
        <div class="nextHourBox" id="nextHour-01">
          <div id="Temp">--</div>
          <div id="weatherIcon-container">
            <img src="#" id="weatherIcon" class="icons" />
          </div>
        </div>
        <div class="nextHourBox" id="nextHour-02">
          <div id="Temp">--</div>
          <div id="weatherIcon-container">
            <img src="#" id="weatherIcon" class="icons" />
          </div>
        </div>
        <div class="nextHourBox" id="nextHour-03">
          <div id="Temp">--</div>
          <div id="weatherIcon-container">
            <img src="#" id="weatherIcon" class="icons" />
          </div>
        </div>
        <div class="nextHourBox" id="nextHour-04">
          <div id="Temp">--</div>
          <div id="weatherIcon-container">
            <img src="#" id="weatherIcon" class="icons" />
          </div>
        </div>
        <div class="nextHourBox" id="nextHour-05">
          <div id="Temp">--</div>
          <div id="weatherIcon-container">
            <img src="#" id="weatherIcon" class="icons" />
          </div>
        </div>
      </div>
      <!-- extra boxes for future daily forcast   -->
      <div class="display-box" id="nextDayTemperatures">
        <div class="nextDayBox" id="nextDay-01">
          <div id="Temp">--</div>
          <div id="weatherIcon-container">
            <img src="#" id="weatherIcon" class="icons" />
          </div>
        </div>
        <div class="nextDayBox" id="nextDay-02">
          <div id="Temp">--</div>
          <div id="weatherIcon-container">
            <img src="#" id="weatherIcon" class="icons" />
          </div>
        </div>
        <div class="nextDayBox" id="nextDay-03">
          <div id="Temp">--</div>
          <div id="weatherIcon-container">
            <img src="#" id="weatherIcon" class="icons" />
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
